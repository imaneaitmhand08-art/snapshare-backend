spring.application.name=snapshare-backend
spring.datasource.url=jdbc:mysql://localhost:3306/snapshare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.port=8080

# Augmenter la limite de taille des requêtes
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1
spring.mvc.async.request-timeout=-1

# ✅ Augmenter le buffer pour les grands JSON (base64 images)
server.tomcat.max-http-response-header-size=65536
spring.codec.max-in-memory-size=10MB